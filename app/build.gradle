plugins { id 'com.android.application' }

android {
    namespace 'com.omkarenterprises.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.omkarenterprises.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
